  scope_statement: 'For every closed connected symplectic surface of genus g>=1, every Hamiltonian diffeomorphism whose fixed points are nondegenerate satisfies #Fix>=2g+2>=Crit(M). This uses the established nondegenerate Floer bound and an explicit surface Morse-function upper bound; no assertion about arbitrary degenerate maps is inferred.'
