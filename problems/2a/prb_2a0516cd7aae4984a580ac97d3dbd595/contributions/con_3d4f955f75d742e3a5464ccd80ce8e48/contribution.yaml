title: A concrete first-order counterexample to the ternary Specker–Blatter extension
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: Full disproof of the recorded extension to relation arity three. Gives an explicitly specified fixed constant-free first-order sentence over one ternary and one binary relation, with labelled count f(n)=0 unless n+1 is a power of two and f(2^k-1)=product_(j=1)^k (2^j-1)!!=(2^k)!/2^(2^k-1). Proves the encoding/decoding bijection, specialized anchor-removal translation, exact count and nonperiodicity modulo two. Also proves a literal same-domain folding into a single ternary relation with identical counts. This is a self-contained attributed reconstruction of Fischer–Makowsky's established counterexample, not a historical novelty claim. Finite enumeration supplements the all-n proof.
  assumptions: []
  limitations: []
