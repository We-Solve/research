  scope_statement: Gives an exact algorithm taking O(k! binomial(h+k−1,k) n²) orientation/combinatorial work for h hull vertices and k=n−h interior points, hence polynomial for each fixed k; gives poly(P)=1 for k=0 and poly(P)=h for k=1. This is an XP bound, not FPT or a general polynomial algorithm.
