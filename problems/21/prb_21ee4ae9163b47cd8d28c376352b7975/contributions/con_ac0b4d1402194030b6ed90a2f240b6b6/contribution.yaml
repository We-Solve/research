title: Certified orders of the finite-field evaluation transform
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: computational_evidence
  scope_statement: Certifies the exact one-variable transform order for every prime p≤31, reproducing all four published identity exponents and proving minimality. Gives explicit generalized eigenvectors forcing 29 | N(29), with N(29)=1253339304585601201485463784571399120. Proves for every prime that the order is S or pS, with the branch decided by an identity test and S the least common multiple of characteristic-factor root orders; this is standard finite-field matrix theory. Also proves for every p and every positive number of variables n that the n-variable transform has exactly the same order N(p), plus inverse/Gram/determinant identities and 4 | N(p) for p ≡ 1 mod 4. All 11 orders, 42 characteristic factors/root orders and explicit certificates pass independent exact checks. No closed formula in p, complete research resolution, priority or human-review claim is made.
  assumptions: []
  limitations:
  - Finite computations through prime 31 do not resolve the arbitrary-prime question.
