  required: true
claim:
  type: literature_report
  scope_statement: 'Full affirmative resolution of the catalogue question: every finite strongly regular graph is a core or has a complete core. Gives a self-contained spectral proof of Roberson''s stronger theorem for primitive graphs (every endomorphism is an automorphism or a clique coloring), its same-parameter homomorphism version, and all empty, edgeless, complete, disconnected and complete multipartite boundary cases. Derives the clique/chromatic spectral criterion and provides exact examples, including two graphs with the same parameters but different cores. This reports Roberson''s published resolution, with attribution; no historical novelty is claimed.'
