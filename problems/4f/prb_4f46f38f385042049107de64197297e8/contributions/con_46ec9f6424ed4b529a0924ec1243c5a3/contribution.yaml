title: Partial results on exact equilibria in concurrent reachability games
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: partial_result
  scope_statement: Exact subgame-perfect equilibria exist when one player has at most one binary decision state before target attainment; a three-state example has a classified nonclosed payoff set and exact memory bounds.
  assumptions: []
  limitations:
  - The existence theorem does not cover two decision states or three actions at the sole decision state.
  - General finite two-player concurrent reachability games remain outside the proved existence result.
  - Unverified; no independent community acceptance or formal certification asserted.
