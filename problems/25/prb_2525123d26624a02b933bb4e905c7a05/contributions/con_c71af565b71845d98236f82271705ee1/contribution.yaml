  scope_statement: For every integer d>=3, an explicit seven-box partition of the unit d-cube has equal volumes 1/7 and pairwise distinct (d-1)-dimensional boundary measures. This disproves the unrestricted real-sided higher-dimensional negative clause in the catalogue. It uses Brand's established planar tiling and leaves the rational-edge-length question unresolved; no historical novelty is claimed for extrusion.
