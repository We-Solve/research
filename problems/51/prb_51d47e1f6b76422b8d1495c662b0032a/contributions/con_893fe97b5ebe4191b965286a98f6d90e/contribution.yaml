claim:
  type: literature_report
  scope_statement: 'Full evaluation of the catalogue''s transition count for the hereditary Goodstein sequence starting at six: T=F_6(6)-3=E_6(5)-2, with both integer hierarchies explicitly defined. The corresponding one-based first-zero term is F_6(6)-2. Includes a self-contained finite digit-borrowing proof, a contextual ordinary-step block lemma, general polynomial endpoint formula, exact hereditary prefix and proof that subsequent exponents freeze. Credits Caicedo''s published general evaluation and the prior 2010 OPG formula; no historical novelty, full enormous simulation, decimal expansion or new uniform Goodstein theorem is claimed.'
