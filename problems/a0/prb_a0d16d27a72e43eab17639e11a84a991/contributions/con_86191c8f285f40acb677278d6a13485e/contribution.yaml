claim:
  type: partial_result
  scope_statement: |-
    Proves exact preservation of both strict-deviation performance components under support compression. Gives polynomial bit-time exact algebraic optimization, arbitrary mixed-optimin search, threshold feasibility and rational-profile verification for each fixed rank(A)+rank(B), and for each fixed number of actions of one player while the other action count is unbounded. Unrestricted bimatrix search, fixed-parameter tractability and a restriction only on rank(A+B) remain unresolved here.

    Significance relative to the checked source: These are the bounded-action and individual-payoff-rank subfamilies explicitly requested by ECON-C72-4. The previous attempt proves tractability only for fixed total action dimension and a single-component LP; the new full-performance-image compression removes that dimension restriction for the stated families.
  assumptions: []
  limitations:
  - 'Accepted as a partial result for each fixed $r=\operatorname{rank}(A)+\operatorname{rank}(B)$, or fixed action count of one player. The other action count can grow. This is not a result from a bound on $\operatorname{rank}(A+B)$ alone, and it does not settle unrestricted mixed-optimin search. The owner supplied a favorable additional mathematical review identified as OpenAI GPT-6 Astra Pro (exact version and settings unknown). It supports the main theorem and calls for these clarifications of the review, rather than corrections to the theorem: the algorithm is uniform with a parameter-dependent exponent (XP-type), not nonuniform and not proved fixed-parameter tractable; upper semicontinuity supplies the needed attainment argument despite strict-deviation discontinuities; and the supported hypograph uses at most $2r+4$ variables, while the displayed optimality formula has an additional comparison block and can use at most $4r+8$ variables in total. Fixed-parameter-value polynomiality is unaffected. Compression preserves both full-game performance components while retaining every original action in deviation tests. Positive weighted optimization returns one global optimin; a threshold-feasible witness need not be optimin, and varying positive weights is not claimed to generate the complete Pareto frontier. Exact outputs may be algebraic rather than rational. The complete owner-supplied Astra Pro report is retained as a separate supplementary artifact. Its model attribution is supplied by the owner, not an authenticated provider attestation.'
