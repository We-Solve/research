  scope_statement: For any odd prime q and n≥0, q² divides F_n iff ord_q(2)=2^(n+1) and 2^(q−1)≡1 mod q². Exact enumeration proves that no prime q≤100000 is a repeated factor of any Fermat number, with no upper bound on n. The universal square-freeness conjecture remains open.
