  type: literature_report
  scope_statement: 'Over C, for the generic forms of the catalogue: report Boij–Lundqvist arXiv:2608.22823v1, Theorem 5.5 (commutative quotient, every n>=1) and Corollary 5.6 (exterior quotient, every even n). These prove the specified path series in those families. The unrestricted odd exterior family is not proved by this submission. CLN Proposition 4 is credited for earlier odd n<=19 computations. Clarify the floor/ceiling typo in the 2026 displayed conjectures, not in its theorem or the catalogue. Supply an independent path recurrence proof, 7,740 exact path checks, and 44 exact finite-field Hilbert-vector checks for n=2..12, with code and data. The modular examples alone do not prove generic characteristic-zero equality. This is a literature report, not a newly discovered resolution.'
