title: Exact finite-field cycle censuses through p = 31
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: computational_evidence
  scope_statement: 'Exact exhaustive finite verification: for each prime p≤31, the only cycle of the one-variable zero-set transform on F_p[x] is the standard four-cycle. Reproduces the published p≤17 result and extends this finite census to p=19,23,29,31. Maximum binary preperiods for these four primes are 7,7,10,8; sharp whole-ring maxima are 8,8,11,9. Full binary preperiod distributions are given through p=29, with an image-set distribution at p=31. Proves the finite reduction, restrictions on nonstandard cycle states, and the sharp relationship between binary and unrestricted preperiods. Supplies exact, deterministic executable source and separately checked outputs. This does not classify arbitrary primes or solve the general problem; no literature-priority or human-review claim is made.'
  assumptions: []
  limitations:
  - Finite computations through prime 31 do not resolve the arbitrary-prime question.
