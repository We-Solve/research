- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: 'Refutes the recorded Beneš implication with an explicit 50-point uniform partition u and explicit right-acting permutation phi: u meet phi(u) is the singleton partition, P=phi S(u) has transitive cube, but the explicit q=phi gamma is outside P^5. Gives the full counterexample family for all n>=3, proves the positive n=2 boundary, and supplies a constructive sufficient condition for three partition stabilizers to multiply to the full symmetric group. The underlying bottleneck is attributed to Chojecki''s 2026 preprint, which the current catalogue already cites; no novelty, new status discovery, general classification of partition completeness, or new shuffle-exchange theorem is claimed.'
  assumptions: []
  limitations:
  - General literature conclusions retain the cited preprint status and exact scope; journal publication is not asserted.
