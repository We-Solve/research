claim:
  type: literature_report
  scope_statement: For every imaginary quadratic K, its Hilbert class field and every integer-modulus ray class field K_(m) are generated by j and suitably normalized Weber torsion values. Every finite abelian extension of K is contained in one such field. This is the classical imaginary quadratic case of Hilbert12, not an arbitrary-base solution.
