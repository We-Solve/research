  type: partial_result
  scope_statement: Claims optimal-play draws for Catch-Up on Fibonacci prefix sets S_n={F_1,...,F_n}, with F_1=1 and F_2=2, whenever their total sum is even (n divisible by 3), together with the manuscript's clean-state/no-jump and optimal-move results. Related Fibonacci-family progress attached to the consecutive-integer Catch-Up problem; it does not establish the parent conjecture for all consecutive-integer sets.
  assumptions:
  - The rules, conventions and win/draw/loss objective are those stated in the submitted manuscript.
  limitations:
  - The Fibonacci-set variant is distinct from the consecutive-integer family in the parent statement.
