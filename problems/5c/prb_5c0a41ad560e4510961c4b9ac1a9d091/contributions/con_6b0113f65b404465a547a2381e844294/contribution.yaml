  scope_statement: Let E/Q and nonsquare d in Q*. If both E and its quadratic twist E^(d) have analytic rank at most1 over Q, then the entire Sha(E/Q(sqrt d)) is finite, including its2-primary part. This includes total analytic rank2 after base change. It does not prove Sha finite for all elliptic curves over number fields.
