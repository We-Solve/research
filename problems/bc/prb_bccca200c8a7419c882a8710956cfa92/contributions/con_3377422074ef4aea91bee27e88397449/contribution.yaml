  required: true
claim:
  type: literature_report
  scope_statement: 'Disproves the catalogue''s EVERY-form statement with the nonzero cubic e1∧e2∧e3 in six variables, and proves the exact nonzero universal parameter classification: d=1 or n<=d+2, for positive odd d<=n. Gives the whole decomposable annihilator quotient Hilbert series and a family of nondecomposable full-support counterexamples. The published source explicitly asks about GENERIC forms, so this does not disprove that original question. Supplies credited positive generic cases: all n<=d+4 and cubics through n=9, via an elementary triple-cover complement construction and a seven-block integer determinant certificate. Includes exact executable verification, full coefficient/support data and transparent finite test limits. No novelty or unrestricted generic resolution is claimed.'
  assumptions: []
  limitations:
  - The every-form variant is disproved; the published generic-form question is resolved only in the stated partial ranges.
