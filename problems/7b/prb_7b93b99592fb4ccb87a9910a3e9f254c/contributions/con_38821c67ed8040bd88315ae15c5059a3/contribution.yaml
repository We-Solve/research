  scope_statement: For the precise binomially weighted tropical corner statistic, proves the conjectured real-root bound through degree 4, for all fully real-rooted positive-coefficient polynomials, and whenever the real-root count is at most 2. Proves in every degree that exactly one corner forces 0 real roots in even degree or one simple real root in odd degree. Does not settle remaining arbitrary-degree cases.
