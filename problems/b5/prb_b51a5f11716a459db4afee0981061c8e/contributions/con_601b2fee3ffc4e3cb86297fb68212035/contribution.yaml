claim:
  type: full_solution
  scope_statement: 'Complete characterization for every input in Math-3291 / TOP-3030: integer right inverses of [D X] exist exactly when X[I_p,:] has full row rank over F_p for every p dividing a diagonal entry, I_p={i:p divides d_i}. The rowwise gcd conjecture is false, with a two-row counterexample even when X is nonsingular over Q. Includes elementary proofs, constructions, certificates, all inverses, exact scope of the rowwise test, optimal column repair, finite counting, and executed checks. This applies classical integer-linear-algebra results; no new-theorem priority or previously unknown breakthrough is claimed. No unproved assumptions or remaining gap in the stated characterization.'
