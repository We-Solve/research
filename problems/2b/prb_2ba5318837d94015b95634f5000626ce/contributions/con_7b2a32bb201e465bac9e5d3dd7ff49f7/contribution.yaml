claim:
  type: literature_report
  scope_statement: 'The full affirmative answer to the catalogue''s existence question, prb_2ba5318837d94015b95634f5000626ce / Math-1346 / catalogue entry, under its explicit convention permitting both opposite arcs. Two nonisomorphic loopless digraphs on twelve vertices, with eighteen arcs each, have identical switching decks: three card types, each of multiplicity four. This established answer is credited to McKay and Schweitzer, Section 9, Figure 12 (2013 preprint; 2014 journal publication). The report supplies complete labelled arc data, a self-contained nonisomorphism proof, twelve explicit card isomorphisms, and an exact verifier. A supplementary exhaustive census covers only the C12 underlying-graph family and finds exactly this one equal-deck pair. No historical novelty, digon-free counterexample, arbitrary-order family, or classification of all twelve-vertex digraphs is claimed. Editorial review and independent human verification remain pending.'
