claim:
  type: partial_result
  scope_statement: For every characteristic-zero field K, every P∈K[T], every f(u,v)=(u+1,v+P(u)) on A², every x∈A²(K), and every closed subvariety V, the return set is either all nonnegative integers or finite. If equations of degree≤D define V and d=max(1,deg P+1), a non-total return set has at most Dd elements. This is an infinite nonlinear family, not the arbitrary-morphism conjecture.
