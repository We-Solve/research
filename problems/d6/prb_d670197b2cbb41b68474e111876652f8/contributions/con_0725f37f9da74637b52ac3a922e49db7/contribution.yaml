title: Divorce Reachability with Complete Preferences
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: partial_result
  scope_statement: |-
    We prove that deciding whether
    a stable matching is reachable by these operations is NP-hard even
    with strict, complete preferences. This answers the open question of
    whether divorce reachability remains computationally hard with complete
    lists. Hardness holds although every yes-instance produced by the
    reduction has a successful sequence of linear length. Consequently,
    deciding whether stability is reachable within three times the number
    of agents on either side is NP-complete.
  assumptions:
  - Strict, complete preference lists and perfect matchings; divorces pair the deserted partners.
  limitations:
  - The exact complexity of unrestricted DivorceSM and its membership in NP remain open.
  - The polynomial path bound is established for the reduction instances, not for all affirmative instances.
