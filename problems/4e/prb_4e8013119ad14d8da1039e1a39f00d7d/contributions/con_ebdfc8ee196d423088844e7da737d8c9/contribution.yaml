claim:
  type: literature_report
  scope_statement: 'Credit Heule–Kullmann–Marek’s published two-colour threshold: every colouring of [7825] has a monochromatic Pythagorean triple and [7824] admits an avoiding colouring. Deduce that every two-colouring of N has such triples with arbitrarily large minimum entry, indeed one inside every dilate d[1,7825]. This does not settle three or more colours; the giant UNSAT proof is not rerun.'
