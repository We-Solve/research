claim:
  type: partial_result
  scope_statement: For every positive integer p, the smooth oriented lens space L(p,1) bounds a smooth rational homology four-ball exactly for p=1 or p=4. The obstruction is proved from homology and the credited Ozsváth–Szabó correction-term theorem; the p=4 existence case is credited to Lisca. This is a special-family decision, not complete invariants for all homology spheres.
