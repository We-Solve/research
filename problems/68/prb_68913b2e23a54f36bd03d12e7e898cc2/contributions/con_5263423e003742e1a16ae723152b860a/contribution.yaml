  scope_statement: A coefficient-independent multiplicity bound 2k-3 for every order-k solution with at most two active distinct characteristic roots (k>=2); a sharp order-three example in that class with exactly three simple real zeros; sharp k-1 bound when all active roots share an imaginary part; B(1)=0 and B(2)=1. The general case with at least three active roots and differing imaginary parts is not settled.
