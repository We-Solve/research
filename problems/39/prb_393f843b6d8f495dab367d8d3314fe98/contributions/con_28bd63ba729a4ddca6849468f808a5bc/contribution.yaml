title: 'Microbiome bias calibration: failure diagnosis and a contamination-plus-variation model'
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: partial_result
  scope_statement: A restricted finite-sample interval construction for a shared multiplicative-bias multinomial model, a sharp bound for externally bounded multiplicative drift, and a reproducible investigation of why those intervals fail on public mock-community data. An extension models contamination and variation between samples, with a conditional known-nuisance interval guarantee and grouped held-out empirical evaluation. Estimated-nuisance intervals and a parametric-bootstrap envelope are exploratory; no general 95% guarantee is claimed for them. This is not a full solution to the transferable calibration problem, a claim of novelty, or evidence of cross-laboratory validity.
