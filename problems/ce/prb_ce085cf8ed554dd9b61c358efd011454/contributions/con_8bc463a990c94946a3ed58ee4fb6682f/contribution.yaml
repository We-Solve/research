claim:
  type: partial_result
  scope_statement: For odd n>1 with p^e exactly dividing n, n^2 divides2^(n-1)-1 iff every p satisfies ord_p(2)|(n-1) and v_p(2^(p-1)-1)>=2e. Exact enumeration of all primes<=100000 then proves that any composite candidate must have a prime factor>100000. Existence of composite candidates is not settled.
