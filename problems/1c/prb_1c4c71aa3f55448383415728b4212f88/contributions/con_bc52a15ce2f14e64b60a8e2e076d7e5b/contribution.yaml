title: Littlewood for cubic-field bases with prescribed divisibility
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: If (1,alpha,beta) is a Q-basis of a cubic subfield of R, then Littlewood holds with arbitrarily small products along q divisible by any fixed positive D; the approximating numerator for alpha can also be divisible by D and gcd(q,r,s)=1. This follows from de Mathan’s published Theorem1.5, both cubic signatures.
