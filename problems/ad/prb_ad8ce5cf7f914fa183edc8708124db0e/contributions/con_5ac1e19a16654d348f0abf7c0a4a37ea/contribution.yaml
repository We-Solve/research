  scope_statement: The explicit six-point general-position set {(0,0),(12,0),(0,12),(5,1),(6,5),(1,5)} has rho(S)=2, certified by all 60 unoriented cyclic orders. Thus the literal exact floor(n/4) conjecture fails at n=6. Does not determine rho(n) generally or refute n/4+O(1); known small-value obstruction credited to AAK Table 1.
