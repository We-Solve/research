claim:
  type: partial_result
  scope_statement: For every absolutely simple abelian variety over a number field with potential complex multiplication, the identity component of its l-adic algebraic monodromy group equals MT(A) tensor Q_l for every prime l. The deduction uses Lombardo’s finite-index theorem after a finite field extension. Nonsimple products and non-CM varieties are outside this reported scope.
