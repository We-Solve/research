- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: 'Reports the established full disproof of the exact ordinary coefficient-difference conjecture, credited to Katkova, Shapiro and Vishnyakova (2024), Section 5. Gives a complete self-contained proof: the positive-coefficient polynomial (x+1)^13(38x^2-89x+83) has 13 real roots counted with multiplicity and parity statistic 11. Supplies an explicit integer-coefficient polynomial with 13 distinct negative roots and statistic 11, plus a closed-form family for every degree n>=15 with exactly n-2 real roots and statistic n-4. Includes a separate exact verifier and finite audits through degree 100. No historical novelty or minimum-degree claim is made; the all-degree proof is algebraic.'
