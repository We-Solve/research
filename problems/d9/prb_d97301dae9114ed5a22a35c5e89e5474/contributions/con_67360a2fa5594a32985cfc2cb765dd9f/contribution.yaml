  scope_statement: For every homogeneous knot K, positivity is equivalent to s(K)=2g_3(K), where s is Rasmussen’s invariant; this follows from Abe’s Theorems1.2–1.3 and gives a diagram-independent positivity test on that class, not a universal positive-diagram move calculus.
