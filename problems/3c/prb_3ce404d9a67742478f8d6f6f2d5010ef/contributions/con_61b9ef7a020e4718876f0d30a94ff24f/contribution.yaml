  scope_statement: 'For Y=S3 and every smooth knot K, the two assertions in Kirby Problem 1.13 hold: fibering of zero surgery implies fibering of the exterior in the prescribed primitive class, and capping a taut Seifert surface preserves tautness. The reverse fibering and norm statements use Gabai’s published theorems, with generator classes and the unknot case checked explicitly.'
