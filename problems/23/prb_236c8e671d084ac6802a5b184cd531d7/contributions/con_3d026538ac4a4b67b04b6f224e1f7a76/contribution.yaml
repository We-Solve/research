claim:
  type: partial_result
  scope_statement: For r=floor(ell/2), k>=3 and ell>=2, explicit nonnegative degree-2k polynomials have exactly (10*floor(k/3)^2)^r*k^(ell-2r) isolated real zeros, giving liminf N(k,ell)/k^ell >= (10/9)^r. Includes a fully verified rational ten-zero sextic, N(k,1)=k, N(1,ell)=1, a general (2k-1)^ell upper bound, and the known N(2,2)=4 and N(3,2)=10 using the credited published planar upper bound. Does not determine the sharp general asymptotic constant.
