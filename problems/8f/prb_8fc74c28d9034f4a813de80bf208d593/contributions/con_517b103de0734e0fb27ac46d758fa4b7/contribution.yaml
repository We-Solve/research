claim:
  type: literature_report
  scope_statement: For each fixed integer base b>=2, prime palindromes have relative density zero among all base-b palindromes, with the versioned Banks–Hart–Sakata Theorem5.1 bound O_b(logloglog x/loglog x). Every even-length palindromic prime must equal b+1, if b+1 is prime. Infinitude of odd-length prime palindromes is not settled.
