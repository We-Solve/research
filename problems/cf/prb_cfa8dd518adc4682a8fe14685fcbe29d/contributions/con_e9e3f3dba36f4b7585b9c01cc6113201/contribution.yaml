  scope_statement: There are >>x/(log x)^3 primes p<=x with p+2 having at most two prime factors and p+6 at most76, by Heath-Brown–Li Theorem1. Infinitely many such p have p+2 either prime or a product of two distinct primes. This is an almost-prime approximation to Dickson, not simultaneous primality.
