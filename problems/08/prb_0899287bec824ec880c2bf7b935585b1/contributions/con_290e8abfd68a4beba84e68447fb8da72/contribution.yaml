- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: Reports the established disproof of the exact shifted coefficient-difference conjecture, credited to Katkova, Shapiro and Vishnyakova (2024), Section 5. Gives a complete self-contained proof that (x+1)^22(38x^2-188x+326) has 22 real roots counted with multiplicity but shifted parity statistic 20. Proves a closed-form family for every degree n>=24 with exactly n-2 real roots and statistic n-4; classifies the same family over 15<=n<=23; and proves that sufficiently small rational splittings give simple roots in every degree n>=24. Supplies an explicit primitive integer degree-24 polynomial with 22 distinct negative rational roots and statistic 20. Includes full exact coefficient certificates and a separate verifier with independent interpolation and Sturm computations. No historical novelty or global minimum-degree claim is made.
  assumptions: []
  limitations: []
