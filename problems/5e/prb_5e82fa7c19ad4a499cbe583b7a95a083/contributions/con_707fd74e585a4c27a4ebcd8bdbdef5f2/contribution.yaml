claim:
  type: partial_result
  scope_statement: Among imaginary quadratic fields ordered by absolute discriminant, the lower limiting proportion with 3 not dividing the class number is at least 1/2; among real quadratic fields it is at least 5/6. This follows from the unconditional Davenport–Heilbronn 3-torsion averages, not the full Cohen–Lenstra distribution.
