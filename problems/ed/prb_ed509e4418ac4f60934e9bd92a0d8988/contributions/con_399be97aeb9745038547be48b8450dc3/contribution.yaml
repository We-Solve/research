claim:
  type: literature_report
  scope_statement: 'Full disproof of the recorded universal equality for fractional graph powers: for the connected cubic triangular prism G=C3 Cartesian K2 and the permitted exponent pair (m,n)=(3,5), omega(G^(3/5))=5 and chi(G^(3/5))=6. Includes a self-contained clique bound, local five-color contradiction and explicit six-coloring, plus complete finite clique enumeration, generic exhaustive five-color search and a separately checkable UNSAT certificate. The established counterexample and forcing method are credited to Hartke, Liu and Petříčková (2012); no historical novelty or classification of other exponents is claimed.'
