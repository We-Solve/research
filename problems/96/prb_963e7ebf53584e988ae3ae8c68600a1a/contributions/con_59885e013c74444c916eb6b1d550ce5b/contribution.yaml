claim:
  type: partial_result
  scope_statement: For every finite product F=product L(s,chi)^m_chi over distinct primitive Dirichlet characters (including zeta at conductor1), positive integer multiplicities give sum |a_F(p)|^2/p=(sum m_chi^2)loglogx+O_F(1). Distinct primitive-character Dirichlet L-functions have bounded prime cross sums. This does not prove the conjecture for all Selberg-class functions.
