title: Two-player partial results for axiomatic containment of Mertens-stable sets without genericity
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: partial_result
  scope_statement: Containment of a Mertens characteristic-zero stable set in every selected set for all 2x2 games; a rank criterion for stability of quasi-strict bimatrix equilibrium singletons; a finite exclusion certificate and the resulting stability of selected sets consisting entirely of quasi-strict equilibria; the set-level settlement of a degenerate 2x3 example; all 2xn games with a strictly dominant column; and exact selection of a whole equilibrium face under explicit balance and spanning conditions, including faces of unbounded dimension. The axioms are assumed globally on all finite games and only the target game is restricted to two players.
  assumptions:
  - The global axioms B, D* and I* of Govindan and Wilson hold for the rule on all finite games.
  - The balance and spanning conditions are assumed where stated.
  limitations:
  - No proof or counterexample is claimed for arbitrary finite two-player target games.
  - The claims are reported by the authors and are not independently verified; no formal proof or referee check is claimed.
  - The exact-arithmetic computer checks reported in the underlying drafts are not included.
