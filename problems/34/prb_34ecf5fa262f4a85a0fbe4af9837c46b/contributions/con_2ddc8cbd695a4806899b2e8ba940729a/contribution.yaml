claim:
  type: partial_result
  scope_statement: Claims a largest globally axiom-compatible solution rule via compact pruning and exact elimination reformulation; continuous-section sufficient criterion, strict/fully-mixed and nongeneric zero-sum polymatrix cases, duplicate/strong-embedding transfers, two payoff-limit counterexamples, and a Hopf-map obstruction; universal S1 remains unresolved.
  assumptions:
  - Exact global axioms B, D*, I* and Mertens characteristic-zero stability per Govindan–Wilson v2
  - Finite normal-form games including additional players/actions; no closedness assumed for the family of selected sets
  - Uses literature all-game stability properties, stable-image and stable-lift results
  limitations:
  - No universal containment proof or globally compatible counterexample
  - No novelty or formal/human/referee verification certification
  - Payoff-limit and Hopf-map obstructions do not disprove S1
  - Source identity metadata was corrected editorially; original files and normalization audit are archived.
  - Submitted research claim; correctness and novelty have not been independently established.
