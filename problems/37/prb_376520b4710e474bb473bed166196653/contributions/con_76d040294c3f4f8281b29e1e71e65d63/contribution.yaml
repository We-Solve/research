claim:
  type: partial_result
  scope_statement: For every real x>=2, Y(x)=j(P_x)-1 where P_x=product_(p<=x)p and j(P) is the least length forcing a coprime integer in every consecutive interval. This gives a complete exact cyclic-gap algorithm; Iwaniec’s published corollary yields Y(x)<<x^2. No sharp asymptotic or x^(1+o(1)) upper bound is proved.
