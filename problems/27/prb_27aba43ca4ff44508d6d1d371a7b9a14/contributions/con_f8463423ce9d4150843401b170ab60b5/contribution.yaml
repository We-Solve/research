  scope_statement: Full resolution of the stated inequality, with its optimal coefficient 6/pi^2, all equality cases, absolute convergence, the exact Hilbert-space projection deficit and minimum-norm interpolation. Also proves sharp finite-prefix constants (including the N=2 tie), exact uniform block-truncation norm, and the failure of ordinary prefixes to converge in operator norm. This is an attributed report of the anonymous Open Problem Garden solution dated 3 November 2013, with detailed proofs of standard consequences; no historical novelty or prize entitlement is claimed.
