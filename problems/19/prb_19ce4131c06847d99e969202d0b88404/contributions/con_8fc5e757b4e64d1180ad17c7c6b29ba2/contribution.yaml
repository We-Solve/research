claim:
  type: literature_report
  scope_statement: Gives a complete proof of eventual period 1, 2 or 3 for every finite positive-integer array allowed by the catalogue. The known result is credited to Eliahou-Erickson (2013) and Cain-Enin (2020), not claimed as historically new. The proof includes a bounded-height argument, exact partition quotient and support-union lifting condition, all cycles for n>=8, the complete 44-state transition table for n<=7, and every labelled cycle family. Least period three occurs only with seven columns, with infinitely many passive-label lifts. The 2013 publisher abstract and bibliography were checked; its full proof was unavailable and is not claimed read. The later stronger linear preperiod bound is not independently proved here. Exact computation checks 28,628 quotient states, all 4,650 specified bounded initial arrays and constructed large-label cycles, with scope explicitly distinguished from the infinite proof.
  assumptions: []
  limitations: []
