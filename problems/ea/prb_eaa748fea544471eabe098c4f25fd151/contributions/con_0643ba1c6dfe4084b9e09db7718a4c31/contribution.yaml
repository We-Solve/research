claim:
  type: partial_result
  scope_statement: For simple real-rooted P of degree n and arbitrary nonzero real Q with degree below n, exact upper/lower-half-plane zero counts of P+itQ for every nonzero real t are given by signs of t Q(r)/P'(r); common real roots are counted with their exact simple multiplicity. Q may have nonreal or multiple roots. Includes a root-multiset parity rule and vertical-strip localization for one-sign residues. Does not cover nonreal/multiple P roots or deg Q>=deg P.
