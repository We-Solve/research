claim:
  type: full_disproof
  scope_statement: 'Disproves the catalogue formula as explicitly quantified for all n,d>=1 and k>=2 over C: at (k,d,n)=(4,1,3) it predicts 5, whereas the generic fourth-power rank of ternary quartics is 6. Supplies a self-contained catalecticant lower bound and surjective-Jacobian/constructibility upper bound, plus exact integer matrices and two-algorithm determinant certificates. This is a correction of the catalogue scope using a classical Alexander–Hirschowitz exception, not a newly discovered result. The original 2017 conjecture explicitly restricts k,n,d>=2; that higher-degree conjecture is not refuted or resolved here. No claim is made about every quartic, real typical ranks, or all other parameter triples.'
  assumptions: []
  limitations:
  - Full disproof applies to the prior d>=1 catalogue statement, not the corrected k,n,d>=2 conjecture.
