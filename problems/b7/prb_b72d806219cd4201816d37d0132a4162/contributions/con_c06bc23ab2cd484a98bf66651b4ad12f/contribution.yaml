title: The exact rectangle-slicing number is 2m−2
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: 'Determines the recorded least uniform slicing number exactly: f(m)=2m−2 for every integer m≥2. The upper bound follows from Tardos (1995), Theorem 1.2 and Corollary 5.2, through an explicit parameter-preserving reduction to separated two-intervals; at most m−1 vertical and m−1 horizontal lines suffice. An integer-coordinate family with independence number m−1 requires 2m−2 lines, proving sharpness for every m. Includes a finite closed-core argument for arbitrary nonempty interval endpoint conventions, full reduction and sharpness proofs, and two separately written exact coordinate checkers. Resolves the catalogue formulation by established literature; no new extremal theorem or new proof of Tardos’s topological theorem is claimed. No human review or editorial acceptance is asserted.'
