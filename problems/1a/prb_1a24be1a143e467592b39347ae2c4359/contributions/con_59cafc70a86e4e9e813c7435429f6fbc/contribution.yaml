claim:
  type: partial_result
  scope_statement: For independent uniform residues modulo primes Q<=p<2Q, Q=N^0.51, the union U has expectation asymptotic to (log2/0.51)N/logN and relative variance O(logQ/Q). Thus almost all assignments achieve this near-linear size, and a deterministic assignment of at least the mean exists. The prompt’s every-assignment claim remains unproved.
