title: Explicit Roth cutoffs for rational affine images of the real cube root of two
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: partial_result
  scope_statement: For alpha=cuberoot(2), Bennett gives |alpha-p/q|>q^(-49/20)/4. Thus for every rational epsilon>9/20 all reduced solutions of |alpha-p/q|<q^(-2-epsilon) have q<4^(1/(epsilon-9/20)). Explicit analogous bounds hold for alpha=r+s*cuberoot(2), r,s rational and s!=0. No all-epsilon effective Roth theorem is claimed.
