claim:
  type: partial_result
  scope_statement: In a primitive 3x3 magic square of nine distinct integer squares with central entry z^2, z>0 is odd, no prime 3 mod 4 divides z, and product over p=1 mod 4 dividing z of (2 v_p(z)+1) is at least 9. Thus z=1 and z=p^e with p=1 mod 4 and e<=3 are impossible, as are centers with any 3 mod 4 prime factor.
