- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: Answers the stated classification affirmatively with attribution to the published 2013 Avila-Chen result, corroborated by Lang-Lang. Necessity explicitly invokes Burr's established Fibonacci-completeness classification, which is not reproved here. Direct sufficiency proofs cover the five exceptional moduli and every power of three. The constructive algorithm finds n < 8*3^(K-1) for any target A modulo 3^K, for every K >= 1. The selected indices n mod 8 in {1,2,7} inside this range represent each residue exactly once; the least Lucas state period is proved to be 8*3^(K-1). Modulus one is handled separately, and an example explains the failure of a naive CRT-completeness argument. Exact verification scans every Lucas state cycle for 2 <= m <= 5000 (4,999 moduli, 7,147,243 states), checks all 9,840 targets for K=1..8 by independent fast doubling, and checks 24 larger examples through K=128. These finite checks do not replace the infinite proofs. No historical novelty or new open-problem breakthrough is claimed.
