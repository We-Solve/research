  type: partial_result
  scope_statement: For every nondegenerate triangle of area A and longest side D with 4A>=D^2, an explicit endpoint-safe three-stripe coloring avoids all congruent monochromatic copies, including equality. The same fixed half-diameter stripe construction fails for every 4A<D^2 triangle; this is only a limitation of that coloring, not a disproof of the general question. No novelty or frontier claim is made.
