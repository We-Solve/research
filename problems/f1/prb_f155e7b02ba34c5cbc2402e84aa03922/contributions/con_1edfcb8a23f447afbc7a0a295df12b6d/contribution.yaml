title: Symbolic versus ordinary powers for linearly independent projective points
profiles:
- id: mathematical_argument
  version: 1
  required: true
claim:
  type: literature_report
  scope_statement: 'Gives the entire Hilbert-series difference for every power m>=1 of s linearly independent points in P^(n-1), for all 1<=s<=n; also proves equality of powers for every finite set of points on P^1. Credits Fröberg–Shapiro (2026) for the spanning case and earlier Chakraborty–Mandal complete-graph invariants. Supplies a self-contained ambient-variable convolution, exact support/top coefficients, minimal quotient-generator counts, containment thresholds with explicit witnesses, and resurgence. Corrects the specific numerical assertion of Theorem 4.4 in arXiv:1904.07717v2 at four coordinate points and power three: symbolic defect 13, not 1. No novelty, journal-version correction, or solution for arbitrary s>n in higher dimension is claimed. Includes an executable exact verifier and its actual finite limits; independent proof review and all recorded computations passed.'
  assumptions: []
  limitations: []
