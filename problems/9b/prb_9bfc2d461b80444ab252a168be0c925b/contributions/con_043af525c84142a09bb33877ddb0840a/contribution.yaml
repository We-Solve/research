claim:
  type: literature_report
  scope_statement: For every odd prime p, the odd greedy algorithm applied to 2/(2(p-1)!-1) terminates with reduced positive numerators 2,3,...,p-1,1 and therefore exactly p-1 unit fractions, by Pihko Theorem3.5. This gives an explicit unbounded-length terminating family, not universal termination.
