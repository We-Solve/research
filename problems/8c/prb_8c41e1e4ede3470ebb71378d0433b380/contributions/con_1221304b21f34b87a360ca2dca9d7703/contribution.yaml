claim:
  type: literature_report
  scope_statement: 'The exact catalogue statement expressly permits disconnected covering sets and is false. This report gives a complete explicit four-set counterexample: each map is holomorphic and globally injective on its entire open set, the four sets cover D*, and their derivatives all equal -exp(1/z)/z^2, which has an essential singularity and zero residue at 0. This is an exposition and exact certificate of a known obstruction, with the 2011 Goodwillie/Thurston discussion, Elsner''s acknowledgement, and a related later nine-set construction by Kavya Mali (crediting GPT-5.6 Sol) clearly attributed. No new disproof or minimum-chart claim is made. The report also proves the zero-residue result when primitive differences take finitely many constants, including connected charts and finitely many components in total, with coefficient pole order at most K+1. The intended connected, nonzero-residue conjecture is not settled here. Finite exact implementation checks cover 625 cells, 10,201 rational points and 48,672 same-colour pairs; the analytic result for all cells is proved, not inferred from sampling.'
