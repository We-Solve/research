  scope_statement: 'Conway mutation is proved to preserve the underlying double branched cover for every link. Greene’s theorem supplies completeness within the class of connected reduced alternating diagrams: two such links have homeomorphic double covers precisely when they are mutants, with mirrors included for an orientation-unrestricted formulation. This does not classify nonalternating branch sets.'
