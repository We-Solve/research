claim:
  type: literature_report
  scope_statement: The June 15, 2026 author-hosted submitted preprint of Manoel Lemos and James Oxley answers the main exact-equality question affirmatively; its classification theorem is credited and used, with the four-element boundary proved separately. This submission does not claim a new general classification proof or journal acceptance. It independently proves explicit binary representations, every-subset rank formulas, and complete circuit/cocircuit descriptions for M_(s,t)=P_t(S_s(AG(3,2))), for all positive integers s,t. Every member is a connected nongraphic exact-equality case. S_2(AG(3,2)) is a simple rank-12 sixteen-element counterexample to the catalogue's parallel-only associated variant. The original Open Problem Garden wording broadly excludes trivial modifications and is not refuted by this observation. All connected nongraphic equality cases are not classified here. Exact computations enumerate 131,456 subsets for four small examples and check all 3,600 predicted circuits and 232 cocircuits of M_(2,2), with larger finite sampling limits stated explicitly.
  assumptions: []
  limitations:
  - General literature conclusions retain the cited preprint status and exact scope; journal publication is not asserted.
