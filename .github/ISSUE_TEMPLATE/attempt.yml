name: Submit an attempt
description: A solution, partial result, counterexample, computation or exploration for one problem.
title: "Attempt: "
labels: ["intake", "attempt"]
body:
  - type: markdown
    attributes:
      value: |
        Everything you post here is **public immediately**. The editors review each submission before it is published on the site.
        Each field shows an example in grey. Paste your write-up below (Markdown with LaTeX maths, or TeX), or attach a zip of your `.tex` and `.bib` files and figures. PDF is not accepted.
  - type: input
    id: problem
    attributes:
      label: Problem handle
      description: "For example ERDOS-1 or ECON-C21-57. It is shown on the problem page."
      placeholder: ERDOS-1
    validations:
      required: true
  - type: dropdown
    id: claim
    attributes:
      label: Claim
      description: A special case, a reformulation or a conditional result is not a full solution.
      options:
        - Full solution
        - Full disproof
        - Partial result
        - Conditional result
        - Computational evidence
        - Literature report
        - Exploration
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Exact scope
      description: What exactly is proved, disproved or found, under which assumptions, and what remains open.
      placeholder: |-
        Proves the statement for every prime n (Theorem 1) and checks all n up to 10^6 by computer (Section 3).
        The general case remains open. No unproved assumptions are used.
    validations:
      required: true
  - type: textarea
    id: writeup
    attributes:
      label: Write-up
      description: Markdown with LaTeX maths, or TeX. You can also attach files here.
      placeholder: |-
        ## Result
        **Theorem 1.** For every prime $p$, ...

        ## Proof
        ...

        ## What remains open
        ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Who did the work
      options:
        - People with LLM assistance
        - LLM only (people only prompted or submitted)
        - People only
    validations:
      required: true
  - type: dropdown
    id: llms
    attributes:
      label: LLMs used
      description: Select every LLM involved, or "None". If yours is not listed, select "Other" and name it in the next field.
      multiple: true
      options:
        - None (no LLM used)
        - OpenAI GPT 6.1 Sol
        - OpenAI GPT 6 Astra Ultra
        - OpenAI GPT 6 Astra Pro
        - OpenAI GPT 6 Astra
        - OpenAI GPT Pro 5.4
        - OpenAI GPT Pro 5.2
        - OpenAI GPT 5.2
        - OpenAI Codex 5.2
        - Anthropic Claude Fable 5.1
        - Anthropic Claude Opus 5.5
        - Anthropic Claude Sonnet 5.5
        - Anthropic Claude Haiku 5.5
        - Anthropic Claude Opus 4.8
        - Anthropic Claude Opus 4.5
        - Other (named below)
    validations:
      required: true
  - type: textarea
    id: other_llms
    attributes:
      label: Other LLMs
      description: Only if you selected "Other". One per line, provider and model name, separated by a comma.
      placeholder: |-
        Google, gemini 3 pro
        DeepSeek, r2
  - type: textarea
    id: llm_details
    attributes:
      label: LLM versions, settings and roles
      description: 'One line per LLM: the model name, then "version", "reasoning" and "role", separated by "|". Write "unknown" for anything you do not know.'
      placeholder: |-
        GPT 6.1 Sol | version: unknown | reasoning: max | role: generated the proof
        Claude Opus 5.5 | version: unknown | reasoning: high | role: checked the proof
  - type: textarea
    id: people
    attributes:
      label: People and roles
      description: Everyone who contributed, one per line, with GitHub handles where they have them, and what each person did.
      placeholder: |-
        Ada Lovelace (@ada): proposed the approach and checked the proof
        @babbage: prompted the model and submitted
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Only references you have checked, one per line, with what you used from each.
      placeholder: |-
        P. Erdős, On sets of distances of n points, Amer. Math. Monthly 53 (1946), 248–250. (Used: the construction in Section 2.)
        arXiv:2609.04113, Theorem 4.10. (Used: the regret bound.)
  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: I have the right to publish this material under CC BY 4.0 (software Apache-2.0), and third-party material is credited.
          required: true
        - label: I understand that this issue and its contents are public immediately.
          required: true
        - label: Every LLM and person involved is listed, with versions or "unknown".
          required: true
