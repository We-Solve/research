name: Review a contribution
description: Check one exact revision of an attempt and report what you found.
title: "Review: "
labels: ["intake", "review"]
body:
  - type: markdown
    attributes:
      value: Everything you post here is **public immediately**. The editors review each submission before it is published on the site. Reviews are shown by finding and scope, never as votes. Each field shows an example in grey.
  - type: markdown
    attributes:
      value: |
        The archive includes some of the hardest research problems. Submit only significant contributions to challenging problems. Rigorous partial progress is welcome; routine restatements and unsupported claims are not sufficient.

        Acceptance of LLM-assisted work requires models with demonstrated mathematical capability through the following routes. Examples with demonstrated mathematical success are Astra Pro, Sol 6.1 at High or above, Astra 6 at High or above, Fable, Opus 5.5, Argon, and equivalent future models. Other models qualify through a previously demonstrated multi-agent architecture or a correctness check by a demonstrated model; document the architecture or reviewer and its supporting evidence. People-only contributions are welcome.

        Submit mathematical exposition in Markdown or TeX, with .bib files and figures as needed. No PDFs or direct code, including Lean or Python, in issue text, attachments or repository submissions. Host your own code on GitHub or Hugging Face and link to a pinned version.

        Select every model first, then complete the separate required thinking level / time dropdown and per-model details. Record actual versions, thinking settings, time budgets and roles; use unknown when unavailable. Never infer or invent a thinking setting from a model name.

  - type: input
    id: contribution
    attributes:
      label: Contribution handle
      description: "For example ERDOS-1-A3. It is shown on the contribution page."
      placeholder: ERDOS-1-A3
    validations:
      required: true
  - type: dropdown
    id: finding
    attributes:
      label: Finding
      options:
        - Supports the claim
        - Error found
        - Gap found
        - Counterexample
        - Known result
        - Reproduced
        - Not reproduced
        - Reference suggestion
        - Comment
    validations:
      required: true
  - type: textarea
    id: checked_scope
    attributes:
      label: What you checked
      description: Which sections, lemmas or computations you checked, and how.
      placeholder: Sections 2 and 3 line by line, including Lemma 4; reran the computation in Appendix B with the authors' script.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: The error, gap or confirmation, with exact locations. Markdown with LaTeX maths; no PDFs or direct code. Link to your own code on GitHub or Hugging Face.
      placeholder: "Lemma 4, line 3: the bound $a_n \\le 2^n$ fails for $n = 5$, where $a_5 = 40$. The proof of Theorem 1 uses it in Step 2."
    validations:
      required: true
  - type: dropdown
    id: llms
    attributes:
      label: Models used
      description: Select every model involved, or None for people-only work. Use Other for equivalent future models and models meeting the documented architecture or verification requirement.
      multiple: true
      options:
        - None (no LLM used)
        - OpenAI GPT 6 Astra Pro
        - OpenAI GPT 6.1 Sol
        - OpenAI GPT 6 Astra
        - Anthropic Claude Fable 5.1
        - Anthropic Claude Opus 5.5
        - Argon
        - Other (named below)
    validations:
      required: true
  - type: dropdown
    id: thinking
    attributes:
      label: Thinking level / time
      description: Select the actual setting used. Sol 6.1 and Astra 6 examples require High or above. Use Mixed for different settings, and give actual settings or time budgets per model below. Never guess a setting that was not exposed.
      options:
        - High
        - Extra high
        - Max
        - Ultra
        - Medium
        - Low
        - Time budget (specified per model below)
        - Mixed (specified per model below)
        - Provider-managed (no selectable setting)
        - Unknown (not available)
        - Not applicable (no LLM used)
    validations:
      required: true
  - type: textarea
    id: other_llms
    attributes:
      label: Other LLMs
      description: Only if you selected Other. One per line, provider and model name, separated by a comma. Use unknown for an undisclosed provider.
      placeholder: |-
        Provider, model name
  - type: textarea
    id: llm_details
    attributes:
      label: Per-model versions, thinking and roles
      description: 'One line per model: name | version: exact version or unknown | thinking: actual level or unknown | time: actual budget/duration or unknown | role: work performed. For Argon, add provider: name if known. Write None for people-only work.'
      placeholder: |-
        GPT 6.1 Sol | version: unknown | thinking: high | time: unknown | role: generated the proof
        Claude Opus 5.5 | version: unknown | thinking: unknown | time: 30 minutes elapsed | role: checked the proof
    validations:
      required: true
  - type: textarea
    id: model_evidence
    attributes:
      label: Model eligibility and verification evidence
      description: For models outside the examples, document an equivalent future model's demonstrated mathematical success, a previously demonstrated multi-agent architecture, or a correctness check by a demonstrated model. Identify the reviewer, exact checked scope, settings and supporting links. Self-review alone is not independent verification. Leave empty for people-only work or listed examples.
  - type: textarea
    id: conflicts
    attributes:
      label: Conflicts of interest
      placeholder: None
  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: I have the right to publish this material under CC BY 4.0, and third-party material is credited.
          required: true
        - label: I understand that this issue and its contents are public immediately.
          required: true
        - label: Every LLM and person involved is listed, with versions or "unknown".
          required: true
